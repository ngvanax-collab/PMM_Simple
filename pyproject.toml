[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-pmm-engine"
version = "0.3.0"
description = "Multi-Pair Futures PMM Engine (Hedge Mode Native)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "nicegui>=1.4.20",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "aiosqlite>=0.20.0",
    "orjson>=3.9.15",
    "tenacity>=8.2.3",
    "loguru>=0.7.2",
    "cryptography>=42.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
